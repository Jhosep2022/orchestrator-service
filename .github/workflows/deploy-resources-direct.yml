name: Deploy orchestrator Lambdas (code-only)

on:
  push:
    branches: [ main, qa ]
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage (dev|qa|prod)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ github.event_name == 'workflow_dispatch'
        && (inputs.stage != '' && inputs.stage || (github.ref == 'refs/heads/main' && 'dev' || 'qa'))
        || (github.ref == 'refs/heads/main' && 'dev' || 'qa') }}

    strategy:
      fail-fast: false
      matrix:
        fn:
          - generateOutline
          - persistCourse
          - generateLessons
          - persistLessons
          - generateQuizzes
          - persistQuizzes
          - generateExam
          - persistExam
          - generateResources
          - persistResources
          - emitBuiltEvent

    env:
      AWS_REGION: us-east-1
      NODE_VERSION: 20
      SERVICE_DIR: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve STAGE
        id: stage
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.stage }}" ]; then
            STAGE="${{ inputs.stage }}"
          else
            STAGE=$([ "${{ github.ref }}" = "refs/heads/main" ] && echo "dev" || echo "qa")
          fi
          echo "STAGE=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install deps
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --omit=dev
          else
            npm i --omit=dev --no-audit --no-fund
          fi

      - name: Package ZIP (code-only)
        working-directory: ${{ env.SERVICE_DIR }}
        shell: bash
        run: |
          ZIP="orchestrator-src.zip"
          zip -r "$ZIP" src/ node_modules/ package.json package-lock.json 2>/dev/null || \
          zip -r "$ZIP" src/ node_modules/ package.json
          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Resolve ENV (from environment secrets)
        id: envs
        shell: bash
        run: |
          set -euo pipefail
          # Cargamos solo los que realmente usaremos
          echo "ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}"   >> "$GITHUB_OUTPUT"
          echo "LLM_PROVIDER=${{ secrets.LLM_PROVIDER }}"         >> "$GITHUB_OUTPUT"
          echo "GEMINI_MODEL_ID=${{ secrets.GEMINI_MODEL_ID }}"   >> "$GITHUB_OUTPUT"
          echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}"     >> "$GITHUB_OUTPUT"
          echo "COURSES_TABLE=${{ secrets.COURSES_TABLE_NAME }}"  >> "$GITHUB_OUTPUT"
          echo "RESOURCES_TABLE=${{ secrets.RESOURCES_TABLE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Update function configuration (env)
        shell: bash
        run: |
          FN="${{ matrix.fn }}"
          NAME="orchestrator-service-${{ steps.stage.outputs.STAGE }}-${FN}"

          aws lambda update-function-configuration \
            --function-name "$NAME" \
            --environment "Variables={
              STAGE=${{ secrets.STAGE }},
              LLM_PROVIDER=${{ secrets.LLM_PROVIDER }},
              GEMINI_MODEL_ID=${{ secrets.GEMINI_MODEL_ID }},
              GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }},
              COURSES_TABLE_NAME=${{ secrets.COURSES_TABLE }},
              RESOURCES_TABLE_NAME=${{ secrets.RESOURCES_TABLE }},
              ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }},
              MODULES_TABLE_NAME=${{ secrets.MODULES_TABLE_NAME }},
              LESSONS_TABLE_NAME=${{ secrets.LESSONS_TABLE_NAME }},
              QUIZZES_TABLE_NAME=${{ secrets.QUIZZES_TABLE_NAME }},
              EXAMS_TABLE_NAME=${{ secrets.EXAMS_TABLE_NAME }},
            }"
              

          aws lambda wait function-updated --function-name "$NAME"

      - name: Update function code (matrix)
        shell: bash
        run: |
          FN="${{ matrix.fn }}"
          NAME="orchestrator-service-${{ steps.stage.outputs.STAGE }}-${FN}"

          n=0
          until aws lambda update-function-code \
                  --function-name "$NAME" \
                  --zip-file "fileb://${{ env.ZIP_FILE }}" \
                  --publish >/dev/null; do
            n=$((n+1))
            [ $n -ge 5 ] && exit 1
            sleep 5
          done

          aws lambda wait function-updated --function-name "$NAME"
