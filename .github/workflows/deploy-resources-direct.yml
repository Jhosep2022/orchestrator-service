name: Deploy orchestrator Lambdas (smart)

on:
  push:
    branches: [ main, qa ]
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage (dev|qa|prod)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    # 🔴 IMPORTANTE: apunta al Environment para poder leer sus secrets
    environment: ${{ github.event_name == 'workflow_dispatch'
        && (inputs.stage != '' && inputs.stage || (github.ref == 'refs/heads/main' && 'dev' || 'qa'))
        || (github.ref == 'refs/heads/main' && 'dev' || 'qa') }}

    strategy:
      fail-fast: false
      matrix:
        fn:
          - generateOutline
          - persistCourse
          - generateLessons
          - persistLessons
          - generateQuizzes
          - persistQuizzes
          - generateExam
          - persistExam
          - generateResources
          - persistResources
          - emitBuiltEvent

    env:
      AWS_REGION: us-east-1
      NODE_VERSION: 20.x
      SLS_VERSION: 4.21.1
      SERVICE_DIR: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve STAGE (echo for logs)
        id: stage
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.stage }}" ]; then
            STAGE="${{ inputs.stage }}"
          else
            STAGE=$([ "${{ github.ref }}" = "refs/heads/main" ] && echo "dev" || echo "qa")
          fi
          echo "STAGE=$STAGE" >> $GITHUB_OUTPUT
          echo "Resolved STAGE=$STAGE (environment: ${{ job.environment }})"

      # ── Cache sólo si hay lockfile ──────────────────────────────
      - name: Detect lockfile
        id: lock
        shell: bash
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          if [ -f package-lock.json ]; then
            echo "has_lock=true"  >> $GITHUB_OUTPUT
            echo "lock_path=package-lock.json" >> $GITHUB_OUTPUT
          elif [ -f npm-shrinkwrap.json ]; then
            echo "has_lock=true"  >> $GITHUB_OUTPUT
            echo "lock_path=npm-shrinkwrap.json" >> $GITHUB_OUTPUT
          elif [ -f yarn.lock ]; then
            echo "has_lock=true"  >> $GITHUB_OUTPUT
            echo "lock_path=yarn.lock" >> $GITHUB_OUTPUT
          else
            echo "has_lock=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node (with/without cache)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ steps.lock.outputs.has_lock == 'true' && 'npm' || 'none' }}
          cache-dependency-path: ${{ steps.lock.outputs.has_lock == 'true' && format('{0}/{1}', env.SERVICE_DIR, steps.lock.outputs.lock_path) || '' }}

      - name: Print Node versions (debug)
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          node -v
          npm -v

      - name: Install deps
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --omit=dev
          else
            npm i --omit=dev --no-audit --no-fund
          fi

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            infra:
              - '${{ env.SERVICE_DIR }}/serverless.yml'
              - '${{ env.SERVICE_DIR }}/src/state/**'
            code:
              - '${{ env.SERVICE_DIR }}/src/**'
              - '!${{ env.SERVICE_DIR }}/src/state/**'

      - name: Configure AWS (reads Environment secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Resolve ENV (from environment secrets)
        id: envs
        shell: bash
        run: |
          set -euo pipefail
          echo "COURSES_TABLE=${{ secrets.COURSES_TABLE_NAME }}"        >> $GITHUB_OUTPUT
          echo "RESOURCES_TABLE=${{ secrets.RESOURCES_TABLE_NAME }}"    >> $GITHUB_OUTPUT
          echo "EVENT_BUS_NAME=${{ secrets.EVENT_BUS_NAME }}"           >> $GITHUB_OUTPUT
          echo "ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}"         >> $GITHUB_OUTPUT
          echo "LLM_PROVIDER=${{ secrets.LLM_PROVIDER }}"               >> $GITHUB_OUTPUT
          echo "GEMINI_MODEL_ID=${{ secrets.GEMINI_MODEL_ID }}"         >> $GITHUB_OUTPUT
          echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}"           >> $GITHUB_OUTPUT

      # ── Deploy completo (infra cambiada) ─────────────────────────
      - name: Deploy with Serverless (infra changed)
        if: steps.changes.outputs.infra == 'true'
        working-directory: ${{ env.SERVICE_DIR }}
        env:
          LLM_PROVIDER:          ${{ steps.envs.outputs.LLM_PROVIDER }}
          GEMINI_MODEL_ID:       ${{ steps.envs.outputs.GEMINI_MODEL_ID }}
          GOOGLE_API_KEY:        ${{ steps.envs.outputs.GOOGLE_API_KEY }}
          COURSES_TABLE_NAME:    ${{ steps.envs.outputs.COURSES_TABLE }}
          RESOURCES_TABLE_NAME:  ${{ steps.envs.outputs.RESOURCES_TABLE }}
          EVENT_BUS_NAME:        ${{ steps.envs.outputs.EVENT_BUS_NAME }}
          ALLOWED_ORIGINS:       ${{ steps.envs.outputs.ALLOWED_ORIGINS }}
        run: |
          npx serverless@${{ env.SLS_VERSION }} deploy \
            --stage ${{ steps.stage.outputs.STAGE }} \
            --region ${{ env.AWS_REGION }}

      # ── Deploy rápido (sólo código) ─────────────────────────────
      - name: Package ZIP (code-only)
        if: steps.changes.outputs.infra != 'true'
        working-directory: ${{ env.SERVICE_DIR }}
        shell: bash
        run: |
          ZIP="orchestrator-src.zip"
          zip -r "$ZIP" src/ node_modules/ package.json package-lock.json 2>/dev/null || \
          zip -r "$ZIP" src/ node_modules/ package.json
          echo "ZIP_FILE=$ZIP" >> $GITHUB_ENV

      - name: Update function configuration (env)
        if: steps.changes.outputs.infra != 'true'
        shell: bash
        run: |
          FN="${{ matrix.fn }}"
          NAME="orchestrator-service-${{ steps.stage.outputs.STAGE }}-${FN}"
          aws lambda update-function-configuration \
            --function-name "$NAME" \
            --environment "Variables={STAGE=${{ steps.stage.outputs.STAGE }},LLM_PROVIDER=${{ steps.envs.outputs.LLM_PROVIDER }},GEMINI_MODEL_ID=${{ steps.envs.outputs.GEMINI_MODEL_ID }},GOOGLE_API_KEY=${{ steps.envs.outputs.GOOGLE_API_KEY }},COURSES_TABLE_NAME=${{ steps.envs.outputs.COURSES_TABLE }},RESOURCES_TABLE_NAME=${{ steps.envs.outputs.RESOURCES_TABLE }},EVENT_BUS_NAME=${{ steps.envs.outputs.EVENT_BUS_NAME }},ALLOWED_ORIGINS=${{ steps.envs.outputs.ALLOWED_ORIGINS }}}"

      - name: Update function code (matrix)
        if: steps.changes.outputs.infra != 'true'
        shell: bash
        run: |
          FN="${{ matrix.fn }}"
          NAME="orchestrator-service-${{ steps.stage.outputs.STAGE }}-${FN}"
          aws lambda update-function-code \
            --function-name "$NAME" \
            --zip-file "fileb://${{ env.ZIP_FILE }}" \
            --publish

      - name: Stack info (best effort)
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          npx serverless@${{ env.SLS_VERSION }} info \
            --stage ${{ steps.stage.outputs.STAGE }} \
            --region ${{ env.AWS_REGION }} || true
